<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drone Irrigation System</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <aside></aside>
  <main>
    <div class="date-selector" id="month-strip">
      <button type="button" class="nav-btn" id="prev-month">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <span class="month-label" id="month-label"></span>
      <button type="button" class="nav-btn" id="next-month">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <div class="date-selector" id="date-strip"></div>

    <div class="date-selector" id="hour-strip">
      <div class="hour-track" id="hour-track">
        <span class="current-time-marker" id="current-marker"></span>
        <span class="selected-time-handle" id="selected-handle"></span>
      </div>
      <div class="time-display" id="time-display">--:--</div>
    </div>

    <div id="visuals">
      <div id="controls">
        <ul>
          <li class="active">
            <label>
              <input type="radio" name="map-layer" value="moisture" data-url="./Moisture.jpg" checked />
              <span>Moisture Sensor Reading</span>
            </label>
          </li>
          <li>
            <label>
              <input type="radio" name="map-layer" value="watering" data-url="./Watering.jpg" />
              <span>Watering Zone</span>
            </label>
          </li>
          <li>
            <label>
              <input type="radio" name="map-layer" value="boundary" data-url="./Boundary.jpg" />
              <span>Boundary</span>
            </label>
          </li>
          <li>
            <label>
              <input type="radio" name="map-layer" value="height" data-url="./Height.jpg" />
              <span>Height map</span>
            </label>
          </li>
          <li>
            <label>
              <input type="radio" name="map-layer" value="floor" data-url="./Floor.jpg" />
              <span>Floor map</span>
            </label>
          </li>
          <li>
            <label>
              <input type="radio" name="map-layer" value="vari" data-url="./VARI.jpg" />
              <span>VARI level gradient</span>
            </label>
          </li>
        </ul>
      </div>

      <div id="map">
        <img id="map-display" src="./Moisture.jpg" alt="Moisture Sensors" />
      </div>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const pad = (n) => String(n).padStart(2, '0');
    const toDateKey = (y, m, d) => `${pad(d)}-${pad(m + 1)}-${y}`;

    const now = new Date();
    const today = {
      year: now.getFullYear(),
      month: now.getMonth(),
      day: now.getDate(),
      minutes: now.getHours() * 60 + now.getMinutes()
    };

    let viewYear = today.year;
    let viewMonth = today.month;
    let snapshotDates = new Set();
    let recordMinutes = [];
    let isScrubbing = false;
    let lastLoadedKey = '';
    let requestId = 0;

    const selected = { year: today.year, month: today.month, day: today.day, minutes: null };

    const dateStrip = $('date-strip');
    const monthLabel = $('month-label');
    const nextBtn = $('next-month');
    const hourTrack = $('hour-track');
    const currentMarker = $('current-marker');
    const selectedHandle = $('selected-handle');
    const timeDisplay = $('time-display');
    const mapImage = $('map-display');

    // Initialize 24-hour passive ticks & current time position
    currentMarker.style.left = `${(today.minutes / 1440) * 100}%`;
    const ticks = Array.from({ length: 24 }, (_, hour) => {
      const tick = document.createElement('span');
      tick.className = 'hour-tick';
      tick.style.left = `${(hour / 24) * 100}%`;
      hourTrack.appendChild(tick);
      return tick;
    });

    // Layer switcher
    document.querySelectorAll('input[name="map-layer"]').forEach((radio) => {
      radio.addEventListener('change', (e) => {
        document.querySelectorAll('#controls li').forEach((li) => li.classList.remove('active'));
        e.target.closest('li').classList.add('active');

        mapImage.style.opacity = '0.4';
        setTimeout(() => {
          mapImage.src = e.target.dataset.url;
          mapImage.alt = e.target.nextElementSibling.textContent;
          mapImage.style.opacity = '1';
        }, 120);
      });
    });

    const isToday = (y, m, d) => y === today.year && m === today.month && d === today.day;

    const formatMinutes = (mins) =>
      new Date(2000, 0, 1, Math.floor(mins / 60), mins % 60).toLocaleTimeString('en-US', {
        hour: 'numeric',
        minute: '2-digit'
      });



    function updateTimeUI() {
      const hasTime = selected.minutes !== null;
      selectedHandle.style.display = hasTime ? 'block' : 'none';
      if (hasTime) selectedHandle.style.left = `${(selected.minutes / 1440) * 100}%`;
      timeDisplay.textContent = hasTime ? formatMinutes(selected.minutes) : '--:--';
    }

    function snapToNearestRecord(clientX) {
      if (!recordMinutes.length) return null;
      const { left, width } = hourTrack.getBoundingClientRect();
      const target = Math.min(1439, Math.round(Math.min(1, Math.max(0, (clientX - left) / width)) * 1440));
      return recordMinutes.reduce((best, curr) => (Math.abs(curr - target) < Math.abs(best - target) ? curr : best));
    }

    function renderRecordLines(records) {
      hourTrack.querySelectorAll('.record-line').forEach((el) => el.remove());

      const parsed = records
        .filter((r) => typeof r.time === 'string' && r.time.includes(':'))
        .map((r) => {
          const [h, m] = r.time.split(':').map(Number);
          return h * 60 + m;
        })
        .sort((a, b) => a - b);

      recordMinutes = [...new Set(parsed)];
      recordMinutes.forEach((mins) => {
        const line = document.createElement('span');
        line.className = 'record-line';
        line.style.left = `${(mins / 1440) * 100}%`;
        hourTrack.appendChild(line);
      });

      selected.minutes = recordMinutes.at(-1) ?? null;
      updateTimeUI();
    }

    async function loadRecordsForSelectedDate() {
      const key = toDateKey(selected.year, selected.month, selected.day);
      if (key === lastLoadedKey) return;
      lastLoadedKey = key;

      const id = ++requestId;
      try {
        const res = await fetch(`./${key}.json`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (id === requestId) renderRecordLines(data.Records || []);
      } catch {
        if (id === requestId) renderRecordLines([]);
      }
    }

    function renderHours() {
      const todaySelected = isToday(selected.year, selected.month, selected.day);
      currentMarker.style.display = todaySelected ? 'block' : 'none';
      ticks.forEach((tick, hour) => tick.classList.toggle('future', todaySelected && hour * 60 > today.minutes));
      updateTimeUI();
      loadRecordsForSelectedDate();
    }

    function renderCalendar() {
      monthLabel.textContent = new Date(viewYear, viewMonth, 1).toLocaleDateString('en-US', {
        month: 'long',
        year: 'numeric'
      });
      nextBtn.disabled = viewYear === today.year && viewMonth === today.month;

      dateStrip.innerHTML = '';
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

      for (let day = 1; day <= daysInMonth; day++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'date-item';
        btn.innerHTML = `<span>${day}</span>`;

        const isFuture =
          viewYear > today.year ||
          (viewYear === today.year && viewMonth > today.month) ||
          (viewYear === today.year && viewMonth === today.month && day > today.day);

        if (snapshotDates.has(toDateKey(viewYear, viewMonth, day))) btn.classList.add('has-snapshot');
        if (isToday(viewYear, viewMonth, day)) btn.classList.add('today');
        if (viewYear === selected.year && viewMonth === selected.month && day === selected.day) btn.classList.add('selected');

        if (isFuture) {
          btn.classList.add('future');
          btn.disabled = true;
        } else {
          btn.addEventListener('click', () => {
            dateStrip.querySelector('.selected')?.classList.remove('selected');
            btn.classList.add('selected');

            Object.assign(selected, {
              year: viewYear,
              month: viewMonth,
              day,
              minutes: isToday(viewYear, viewMonth, day) && selected.minutes > today.minutes ? today.minutes : selected.minutes
            });

            renderHours();
          });
        }

        dateStrip.appendChild(btn);
      }
    }

    // Navigation & timeline scrubbing events
    $('prev-month').addEventListener('click', () => {
      if (--viewMonth < 0) { viewMonth = 11; viewYear--; }
      renderCalendar();
    });

    nextBtn.addEventListener('click', () => {
      if (viewYear === today.year && viewMonth === today.month) return;
      if (++viewMonth > 11) { viewMonth = 0; viewYear++; }
      renderCalendar();
    });

    hourTrack.addEventListener('pointerdown', (e) => {
      if (!recordMinutes.length) return;
      isScrubbing = true;
      hourTrack.setPointerCapture(e.pointerId);
      const snapped = snapToNearestRecord(e.clientX);
      if (snapped !== null) {
        selected.minutes = snapped;
        updateTimeUI();
      }
    });

    hourTrack.addEventListener('pointermove', (e) => {
      hourTrack.classList.toggle('future-hover', !recordMinutes.length);
      if (!isScrubbing || !recordMinutes.length) return;
      const snapped = snapToNearestRecord(e.clientX);
      if (snapped !== null && snapped !== selected.minutes) {
        selected.minutes = snapped;
        updateTimeUI();
      }
    });

    hourTrack.addEventListener('pointerup', (e) => {
      if (!isScrubbing) return;
      isScrubbing = false;
      hourTrack.releasePointerCapture(e.pointerId);
    });

    // Initial boot
    renderHours();
    fetch('./snapshots.json')
      .then((res) => res.json())
      .then((data) => {
        const dates = data.dates || [];
        snapshotDates = new Set(dates);

        if (dates.length) {
          const latest = dates
            .map((d) => {
              const [day, month, year] = d.split('-').map(Number);
              return { year, month: month - 1, day, ts: new Date(year, month - 1, day).getTime() };
            })
            .sort((a, b) => b.ts - a.ts)[0];

          viewYear = selected.year = latest.year;
          viewMonth = selected.month = latest.month;
          selected.day = latest.day;
        }

        renderCalendar();
        renderHours();
      })
      .catch((err) => console.error('Failed to load snapshots:', err));
  </script>
</body>

</html>
